[package]
name = "multi_agent_biblio"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[dependencies]
anyhow = "1"
biblatex = "0.12"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
httpdate = "1"
markdown-builder = "1"
quick-xml = { version = "0.41", features = ["serialize"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rig = { package = "rig-core", version = "0.47.1", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { version = "0.47.1", default-features = false }
rig-memory = { version = "0.47.1", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
rig = { package = "rig-core", version = "0.47.1", default-features = false, features = ["test-utils"] }
