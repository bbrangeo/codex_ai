[package]
name = "codex_ai"
version = "0.1.2"
description = "A local OpenAI-compatible gateway for Codex"
repository = "https://github.com/bbrangeo/codex_ai"
license = "MIT"
edition = "2024"
rust-version = "1.89"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = "0.8"
base64 = "0.22"
eventsource-stream = "0.2"
futures-util = "0.3"
getrandom = "0.3"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
